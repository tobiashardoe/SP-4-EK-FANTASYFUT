name: fantasyfut
services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    environment:
      SERVER_ORIGIN: https://fantasyfut.antwi.dk
      DATABASE_PATH: /data/fantasy-web.sqlite
      PORT: "7080"
    volumes:
      - game_data:/data
    networks:
      proxy:
        aliases:
          - fantasyfut-app
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:7080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  game_data:
networks:
  proxy:
    external: true
    name: cit_default
